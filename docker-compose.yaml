services:
  api:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
      target: development
      args:
        - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules/
      - /app/apps/backend/node_modules/
    env_file:
      - ./apps/backend/.env
    command: 'pnpm --filter backend run dev'
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shipyard-network
    restart: unless-stopped

  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shipyard-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - ./apps/backend/.env

  redis:
    image: redis:7-alpine
    restart: always
    command: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - shipyard-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping']
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - ./apps/backend/.env
networks:
  shipyard-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
